  <style>
    .splash{position:fixed;inset:0;z-index:100;transition:opacity .7s ease,transform .7s ease;animation:sp-hide 0s 12s forwards;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#0b8a75 0%,#087967 45%,#064f43 100%);color:#fff;font-family:"Thmanyah Sans",system-ui,sans-serif;overflow:hidden}
    .splash:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,#ffffff14 80%,transparent 90%);animation:sp-sweep 3.2s linear infinite}
    .splash-box{position:relative;text-align:center;animation:sp-up .7s cubic-bezier(.2,.8,.2,1) both}
    .splash-mark{width:92px;height:92px;margin:0 auto 22px;display:block}
    .splash-mark circle{fill:none;stroke:#d8b552;stroke-width:3;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;animation:sp-draw 1.4s .2s cubic-bezier(.6,0,.2,1) forwards}
    .splash-mark path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:160;animation:sp-draw 1.1s .8s ease forwards}
    .splash h1{margin:0 0 26px;font-size:30px;font-weight:700;letter-spacing:-.2px}
    .splash p{margin:8px 0 26px;font-size:13px;color:#cfe9e0}
    .splash-bar{width:180px;height:3px;margin:auto;border-radius:3px;background:#ffffff26;overflow:hidden}
    .splash-bar i{display:block;width:40%;height:100%;border-radius:3px;background:#d8b552;animation:sp-bar 1.1s ease-in-out infinite}
    .splash.out{opacity:0;transform:scale(1.06)}
    body.booting .app *,body.booting .choose-screen *{animation-play-state:paused!important}
    @keyframes sp-hide{to{opacity:0;visibility:hidden}}
    @keyframes sp-draw{to{stroke-dashoffset:0}}
    @keyframes sp-up{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes sp-bar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
    @keyframes sp-sweep{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.splash *,.splash:before{animation:none!important;stroke-dashoffset:0!important}}
  </style>
  <link rel="stylesheet" href="diwan/workspace.css?v=2" />
  <link rel="stylesheet" href="dark.css?v=6" />

    <h1>المُــنـظِّـم</h1><div class="splash-bar"><i></i></div>
  </div></div>

</body>
